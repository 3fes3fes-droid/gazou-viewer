name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix source API calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/jp/gazou/viewer/MainActivity.java")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Uri mediaUri = DocumentsContract.getMediaUri(resolver, opened);",
                  "Uri mediaUri = MediaStore.getMediaUri(activity, opened);",
              ),
              (
                  "FolderResult byChromePath = loadByChromePath(resolver, opened, source, hint);",
                  "FolderResult byChromePath = loadByChromePath(activity, resolver, opened, source, hint);",
              ),
              (
                  "return findByMetadataAcrossVolumes(resolver, opened, source);",
                  "return findByMetadataAcrossVolumes(activity, resolver, opened, source);",
              ),
              (
                  "private static FolderResult loadByChromePath(ContentResolver resolver, Uri opened,",
                  "private static FolderResult loadByChromePath(Activity activity, ContentResolver resolver, Uri opened,",
              ),
              (
                  "private static FolderResult findByMetadataAcrossVolumes(ContentResolver resolver, Uri opened,",
                  "private static FolderResult findByMetadataAcrossVolumes(Activity activity, ContentResolver resolver, Uri opened,",
              ),
              (
                  "MediaStore.getExternalVolumeNames(resolver.getContext())",
                  "MediaStore.getExternalVolumeNames(activity)",
              ),
              (
                  "Build.VERSION.SDK_INT >= 19 && DocumentsContract.isDocumentUri(resolver.getContext(), uri)",
                  "Build.VERSION.SDK_INT >= 19",
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new)
                  changed = True

          if "resolver.getContext()" in source:
              raise SystemExit("resolver.getContext() still remains")
          if "DocumentsContract.getMediaUri" in source:
              raise SystemExit("wrong getMediaUri call still remains")

          if changed:
              path.write_text(source, encoding="utf-8")
          PY

          if ! git diff --quiet; then
            git config user.name "3fes3fes-droid"
            git config user.email "3fes3fes-droid@users.noreply.github.com"
            git add app/src/main/java/jp/gazou/viewer/MainActivity.java
            git commit -m "Fix Android media API calls [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gazou-viewer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
